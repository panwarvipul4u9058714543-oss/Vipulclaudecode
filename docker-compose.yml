# Local development stack: PostgreSQL (with PostGIS) + Redis.
# Bring it up with: `docker compose up -d`
# Bring it down with: `docker compose down`
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: waste_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: waste
      POSTGRES_PASSWORD: waste
      POSTGRES_DB: waste
    ports:
      - '5432:5432'
    volumes:
      - waste_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U waste -d waste']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: waste_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - waste_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  waste_postgres_data:
  waste_redis_data:
